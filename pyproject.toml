[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "efficient-llm"
version = "0.1.0"
description = "Reproducible single-GPU LLM post-training and inference experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "psutil>=6.1,<8",
]

[project.scripts]
efficient-llm = "efficient_llm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/efficient_llm"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: local integration tests",
  "gpu: requires an NVIDIA GPU and GPU dependencies",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["efficient_llm"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "psutil"
ignore_missing_imports = true
